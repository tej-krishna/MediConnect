# -Xmx8G (the Flutter template default) exceeds this machine's total 7G RAM and crashes the
# Gradle daemon with a native OOM once other processes (backend, Mongo, Chrome, IDE) are also
# running. 2G is enough to build this app's current size.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compilation cache uses relative paths, which it cannot compute when the
# Gradle project (E:\...) and the plugin/pub-cache sources (C:\...) live on different drive
# letters on Windows -- every build fails with "this and base files have different roots".
# Disabling incremental compilation avoids that path computation entirely; it costs a slightly
# slower full recompile each time rather than an incremental one.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
